services:
  - type: web
    name: gpt-pc-cloud
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gpt-pc-cloud-db
          property: connectionString
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false

databases:
  - name: gpt-pc-cloud-db
    plan: basic_256mb
    region: singapore
    databaseName: gpt_pc_cloud
    user: gpt_pc_cloud_user
    postgresMajorVersion: "18"
